server:
  port: 8080
grpc:
  client:
    location-service:
      address: static://localhost:9091
      negotiation-type: plaintext
    surge-service:
      address: static://localhost:9092
      negotiation-type: plaintext
    trip-service:
      address: static://localhost:9093
      negotiation-type: plaintext
    payment-service:
      address: static://localhost:9094
      negotiation-type: plaintext
    notification-service:
      address: static://localhost:9095
      negotiation-type: plaintext
spring:
  application:
    name: dispatch-service
clients:
  location: http://location-service
  surge: http://surge-service
  trip: http://trip-service
  payment: http://payment-service
  notification: http://notification-service
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
