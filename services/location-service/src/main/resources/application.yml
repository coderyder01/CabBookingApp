server:
  port: 8081
grpc:
  server:
    port: 9091
spring:
  application:
    name: location-service
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
